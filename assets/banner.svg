<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="Adversarial Review - assume it's broken until proven otherwise">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0b"/>
      <stop offset="0.55" stop-color="#120608"/>
      <stop offset="1" stop-color="#240407"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2d2d"/>
      <stop offset="1" stop-color="#b3000f"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="440" fill="url(#bg)"/>

  <!-- faint scanlines -->
  <g opacity="0.05" fill="#ffffff">
    <rect y="80" width="1280" height="1"/><rect y="160" width="1280" height="1"/>
    <rect y="240" width="1280" height="1"/><rect y="320" width="1280" height="1"/>
  </g>

  <!-- red slash accent -->
  <polygon points="980,0 1120,0 760,440 620,440" fill="#ff2d2d" opacity="0.10"/>
  <polygon points="1060,0 1090,0 730,440 700,440" fill="#ff2d2d" opacity="0.18"/>

  <!-- kicker -->
  <text x="70" y="120" font-family="Consolas, 'Courier New', monospace" font-size="22" letter-spacing="8" fill="#ff5b5b">A CLAUDE SKILL</text>

  <!-- title -->
  <text x="66" y="232" font-family="Arial Black, Helvetica, Arial, sans-serif" font-weight="900" font-size="118" fill="#ffffff" letter-spacing="-2">ADVERSARIAL</text>
  <text x="70" y="338" font-family="Arial Black, Helvetica, Arial, sans-serif" font-weight="900" font-size="118" fill="#ff2d2d" letter-spacing="-2" filter="url(#glow)">REVIEW</text>

  <!-- tagline -->
  <text x="74" y="392" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="29" fill="#c9c9cf">assume it's broken until proven otherwise.</text>

  <!-- rubber-stamp verdict -->
  <g transform="rotate(-13 1080 250)">
    <rect x="905" y="196" width="350" height="108" rx="10" fill="none" stroke="#ff2d2d" stroke-width="7"/>
    <text x="1080" y="270" text-anchor="middle" font-family="Arial Black, Helvetica, sans-serif" font-weight="900" font-size="58" fill="#ff2d2d" letter-spacing="2">NOT READY</text>
  </g>

  <!-- footer strip -->
  <text x="70" y="430" font-family="Consolas, 'Courier New', monospace" font-size="18" letter-spacing="3" fill="#6b6b73">no flattery&#160;&#160;·&#160;&#160;no filler&#160;&#160;·&#160;&#160;just findings + a verdict</text>
</svg>
