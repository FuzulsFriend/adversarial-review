<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t d">
  <title id="t">Adversarial Review - assume it is broken until proven otherwise</title>
  <desc id="d">Beige banner with a blue block holding a page with a heavy bar reading NOT READY, and the words Adversarial Review.</desc>
  <rect width="1280" height="400" fill="#EAE4D8"/>
  <rect x="0" y="0" width="400" height="400" fill="#0B71B2"/>
  <!-- the page under review -->
  <rect x="100" y="70" width="200" height="250" fill="#EAE4D8" stroke="#0E0E10" stroke-width="6"/>
  <g fill="#0E0E10" opacity="0.35">
    <rect x="124" y="98" width="152" height="10"/>
    <rect x="124" y="124" width="120" height="10"/>
    <rect x="124" y="150" width="152" height="10"/>
    <rect x="124" y="176" width="96" height="10"/>
    <rect x="124" y="270" width="140" height="10"/>
  </g>
  <!-- the verdict bar -->
  <rect x="60" y="206" width="280" height="58" fill="#0E0E10"/>
  <text x="200" y="246" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="30" font-weight="700" fill="#EAE4D8" letter-spacing="3">NOT READY</text>
  <text x="200" y="360" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#EAE4D8" letter-spacing="2">THE DEFAULT VERDICT</text>
  <rect x="400" y="0" width="880" height="10" fill="#0E0E10"/>
  <rect x="400" y="390" width="880" height="10" fill="#0E0E10"/>
  <text x="450" y="84" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="24" fill="#085B8F" letter-spacing="4">CLAUDE CODE SKILL</text>
  <text x="446" y="168" font-family="Assistant, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="800" font-size="92" fill="#0E0E10" textLength="790" lengthAdjust="spacingAndGlyphs">ADVERSARIAL</text>
  <text x="446" y="250" font-family="Assistant, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="800" font-size="92" fill="#0E0E10" textLength="560" lengthAdjust="spacingAndGlyphs">REVIEW</text>
  <text x="450" y="306" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="28" fill="#0E0E10">Assume it is broken. Prove otherwise.</text>
  <text x="450" y="364" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="20" fill="#57534B">by Tomer Ezri  /  MIT  /  github.com/FuzulsFriend</text>
</svg>
